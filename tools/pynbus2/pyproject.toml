[project]
name = "pynbus2"
dynamic = ["version"]
description = "Python client library for the plumCore nbus2 messaging bus"
authors = [
    { name = "Marek Koza", email = "qyx@krtko.org" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["nbus2", "plumcore", "embedded", "messaging"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.4", "cbor2>=5"]
ble = ["simplepyble>=0.7", "cbor2>=5"]
swd = ["pyocd>=0.36", "cbor2>=5"]
proxy = ["cbor2>=5"]
ssh = ["cbor2>=5"]
all = ["pynbus2[serial,ble,swd,proxy,ssh]"]

[project.scripts]
pynbus2-ssh-proxy = "pynbus2.ssh_proxy:main"

[project.urls]
Homepage = "https://krtko.org"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = "src/pynbus2/__init__.py"

[tool.pdm.build]
package-dir = "src"
source-includes = ["README.md", "LICENSE", "tests/"]

[tool.pdm.dev-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
